name: Streamlit Keep Alive (Browser Simulation)

on:
  schedule:
    # 6시간마다 실행은 약간 길 수 있습니다. 안전하게 4시간(0 */4 * * *)을 추천합니다.
    - cron: '0 */4 * * *' 
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Visit Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time
          
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print('앱에 접속 중...')
              page.goto('https://cx-strategy-sandbox-d7bvujnlhecutl4eewoprh.streamlit.app/')
              
              # 페이지가 로드되고 WebSocket이 연결될 수 있도록 10초간 대기
              time.sleep(10) 
              print('접속 및 대기 완료. 브라우저를 닫습니다.')
              browser.close()
          "
