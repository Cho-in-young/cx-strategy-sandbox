name: Streamlit Keep Alive (Browser Simulation)

on:
  schedule:
    - cron: '0 */4 * * *' 
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Visit Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time
          
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print('앱에 접속 시도 중 (최대 2분 대기)...')
              
              try:
                  # timeout을 30초에서 120초(120,000ms)로 연장
                  # wait_until을 완화하여 로딩이 덜 끝나도 연결된 것으로 간주
                  page.goto('https://cx-strategy-sandbox-d7bvujnlhecutl4eewoprh.streamlit.app/', timeout=120000, wait_until='domcontentloaded')
                  print('초기 연결 성공. 웹소켓 활성화를 위해 15초 대기합니다.')
                  time.sleep(15)
              except Exception as e:
                  # 접속 시간이 초과되어도 Failed 메일이 오지 않도록 예외(Pass) 처리
                  print(f'접속 중 에러/타임아웃 발생 (핑 역할은 수행함): {e}')
              finally:
                  print('브라우저를 닫습니다.')
                  browser.close()
          "
