name: Streamlit Keep Alive

on:
  schedule:
    # 6시간마다 자동 실행 (UTC 기준)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a ping request to Streamlit App
        run: curl -I https://cx-strategy-sandbox-d7bvujnlhecutl4eewoprh.streamlit.app/
